version: '3.8'

services:
  # --- Centralized PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine
    container_name: freshmarket-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: freshmarket_db
    ports:
      - "5432:5432"
    volumes:
      # Preserves database records on host machine across container restarts
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --- Product Microservice ---
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Points to the PostgreSQL container host name 'postgres' on default port 5432
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/freshmarket_db
    depends_on:
      - postgres
    restart: always

  # --- Cart Microservice ---
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/freshmarket_db
    depends_on:
      - postgres
    restart: always

  # --- Approval Microservice ---
  approval-service:
    build:
      context: ./services/approval-service
      dockerfile: Dockerfile
    container_name: approval-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/freshmarket_db
    depends_on:
      - postgres
    restart: always

# --- Persistent Named Volumes ---
volumes:
  postgres_data: