openapi: 3.0.3
info:
  title: Product Microservice API
  description: Handles product catalog browsing, filtering, and supplier submissions.
  version: 1.0.0

# 1. Reusable Data Schemas
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - category
        - status
      properties:
        id:
          type: string
          example: "prod-101"
        name:
          type: string
          example: "Organic Apples"
        price:
          type: number
          example: 4.99
        category:
          type: string
          example: "Produce"
        status:
          type: string
          example: "APPROVED"
        supplierId:
          type: string
          example: "sup-88"

    ProductSubmissionRequest:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
          example: "Organic Apples"
        price:
          type: number
          example: 4.99
        category:
          type: string
          example: "Produce"
        description:
          type: string
          example: "Fresh organic apples from local farms."

# 2. API Endpoints & Routes
paths:
  /api/v1/products:
    get:
      summary: Fetch approved products with optional search and category filters
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
          description: Filter products by category.
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: Filter products by status (e.g., APPROVED, PENDING).
      responses:
        "200":
          description: A list of products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: Invalid request parameters.
        "500":
          description: Internal server error.

  /api/v1/products/submissions:
    post:
      summary: Submit a new product for approval
      description: Allows suppliers to submit a new product for review and approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSubmissionRequest"
      responses:
        "201":
          description: Product submission successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product submission data.
        "500":
          description: Internal server error.

  /api/v1/products/{id}:
    get:
      summary: Fetch single product details by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Unique product identifier.
      responses:
        "200":
          description: Product details found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found.
        "500":
          description: Internal server error.
